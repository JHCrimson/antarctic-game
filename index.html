<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2a45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Expedition" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Antarctic Expedition</title>
  </head>
  <body>
    <canvas id="map" aria-label="Expedition map"></canvas>
    <header id="hud">
      <div class="stat"><span class="label">Food</span><span id="food" class="value">0</span></div>
      <div class="stat"><span class="label">Fuel</span><span id="fuel" class="value">0</span></div>
      <div class="stat"><span class="label">Load</span><span id="load" class="value">0/40</span></div>
      <div class="stat"><span class="label">Turn</span><span id="turn" class="value">0</span></div>
      <button id="restart" type="button">Restart</button>
    </header>
    <footer id="panel">
      <div id="panel-text" aria-live="polite">
        <div id="panel-title">Tap a highlighted hex to see what it costs</div>
        <div id="panel-detail"></div>
      </div>
      <button id="journal-open" type="button">Journal</button>
    </footer>
    <section id="result" class="overlay" hidden aria-labelledby="result-title">
      <div class="card">
        <h2 id="result-title"></h2>
        <p id="result-summary"></p>
        <dl id="result-stats"></dl>
        <div class="card-actions">
          <button id="result-journal" type="button">Journal</button>
          <button id="result-new" type="button" class="primary">New expedition</button>
        </div>
      </div>
    </section>
    <section id="sheet" hidden aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Cache</h2>
        <button id="sheet-close" type="button">Done</button>
      </div>
      <p id="sheet-summary"></p>
      <p class="sheet-help">On the sledge: − leaves crates here, + loads them.</p>
      <div class="sheet-row" data-res="food">
        <span class="sheet-name">Food</span>
        <button type="button" data-d="-5">−5</button>
        <button type="button" data-d="-1">−1</button>
        <span class="sheet-amount" id="sheet-food">0</span>
        <button type="button" data-d="1">+1</button>
        <button type="button" data-d="5">+5</button>
      </div>
      <div class="sheet-row" data-res="fuel">
        <span class="sheet-name">Fuel</span>
        <button type="button" data-d="-5">−5</button>
        <button type="button" data-d="-1">−1</button>
        <span class="sheet-amount" id="sheet-fuel">0</span>
        <button type="button" data-d="1">+1</button>
        <button type="button" data-d="5">+5</button>
      </div>
    </section>
    <section id="journal" class="overlay" hidden aria-labelledby="journal-title">
      <div class="card">
        <div class="card-head">
          <h2 id="journal-title">Expedition journal</h2>
          <button id="journal-close" type="button" class="primary">Close</button>
        </div>
        <ol id="journal-list"></ol>
        <p id="journal-empty">Nothing yet. Accidents, caches and restocks are recorded here.</p>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
