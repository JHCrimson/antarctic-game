<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2a45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Expedition" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Antarctic Expedition</title>
  </head>
  <body>
    <canvas id="map" aria-label="Expedition map"></canvas>
    <header id="hud">
      <div class="stat"><span class="label">Food</span><span id="food" class="value">0</span></div>
      <div class="stat"><span class="label">Fuel</span><span id="fuel" class="value">0</span></div>
      <div class="stat"><span class="label">Load</span><span id="load" class="value">0/30</span></div>
      <div class="stat"><span class="label">Turn</span><span id="turn" class="value">0</span></div>
      <button id="restart" type="button">Restart</button>
    </header>
    <footer id="panel" aria-live="polite">
      <div id="panel-title">Tap a highlighted hex to see what it costs</div>
      <div id="panel-detail"></div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
